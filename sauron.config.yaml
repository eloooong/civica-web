# yaml-language-server: $schema=./schema/sauron.schema.json
version: "1.0.0"

project:
  name: "civiclens-ph"
  description: "Philippine government data explorer: Next.js 16 plus React 19 plus TypeScript strict plus Tailwind CSS v4, no database, no auth"
  language: "typescript" # typescript | python | rust | go | multi
  framework: "nextjs" # optional framework hint

# The 17 Runtimes Bound by sauron (set true/false per workspace)
runtimes:
  claude: true
  cursor: true
  windsurf: true
  copilot: true
  cline: true
  trae: true
  zed: true
  codex: true
  gemini: true
  hermes: true
  kimi: true
  kiro: true
  openclaude: true
  opencode: true
  pi: true
  qwen: true
  adal: true
  codebuddy: true

# The Fellowship: 9 Specialized Sub-Agents
fellowship:
  gandalf:
    enabled: true
    role: "Master Planner and Strategy Guide"
    alias: ["planner", "lead"]
  aragorn:
    enabled: true
    role: "Principal System Architect"
    alias: ["architect", "design"]
  legolas:
    enabled: true
    role: "Precision Linter and Syntax Bug Hunter"
    alias: ["linter", "syntax"]
  gimli:
    enabled: true
    role: "Refactorer and AST Dead Code Slasher"
    alias: ["refactor", "cleanup"]
  boromir:
    enabled: true
    role: "Security Auditor and Shield"
    alias: ["security", "audit"]
  frodo:
    enabled: true
    role: "Core Task Executor and Ringbearer"
    alias: ["executor", "coder"]
  samwise:
    enabled: true
    role: "Git Commits and State Keeper"
    alias: ["commits", "git"]
  merry:
    enabled: true
    role: "QA and TDD Specialist"
    alias: ["tester", "tdd"]
  pippin:
    enabled: true
    role: "Edge Case and Chaos Prober"
    alias: ["fuzzer", "chaos"]

# Active Skill Domains (8 Functional Departments)
departments:
  architecture: true
  backend: true
  database: true
  devops: true
  frontend: true
  quality: true
  security: true
  workflow: true

# Token Optimization Engine (Caveman Mode)
caveman:
  default_mode: "full" # full (~60% token savings) | lite (~40%) | ultra (~75%) | off
  enforce_on_commits: true

# Security & Command Firewall
security:
  agent_guard: true
  block_destructive_commands: true # hard-blocks rm -rf, DROP DATABASE, git push --force
  protect_credentials: true # hard-blocks .env, id_rsa, AWS/GCP credential reads
  enforce_docker_sandbox: false # set true to require Docker container execution

# Safety and Sandboxing Settings
settings:
  backup_existing: true
  dry_run: false
  anti_vibe_coding_strict_mode: true
  circuit_breaker_max_steps: 20
